# Build and release netdisk for Linux, macOS, Windows and FreeBSD in one workflow.
#
# netdisk is pure Go (no cgo, no external runtime deps: only the standard
# library plus golang.org/x/net), so every target is cross-compiled from a
# single Linux runner. No macOS / arm64 runner and no system packages needed.
#
# Jobs:
#   - build:   cross-compile netdisk for all targets on ubuntu-latest, then
#              upload the binaries as an artifact.
#   - release: on a v* tag, gather the artifacts, generate SHA256SUMS.txt and
#              publish a GitHub Release.
#
# Trigger: push a v* tag      -> build + publish a Release
#          workflow_dispatch  -> build artifacts only, kept for 90 days

name: build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build all targets
        run: |
          # Version is injected via -X main.Version (see main.go).
          # Format matches the existing scheme: YY.MM.DD.
          VERSION=$(date +%y.%m.%d)
          mkdir -p dist
          for t in \
            linux/amd64 linux/arm64 linux/arm linux/386 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 \
            freebsd/amd64 freebsd/arm64
          do
            os="${t%/*}"; arch="${t#*/}"
            ext=""; name_arch="$arch"
            if [ "$os" = windows ]; then ext=".exe"; fi
            if [ "$arch" = arm ]; then name_arch="armv7"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 \
              go build -trimpath -ldflags="-s -w -X main.Version=$VERSION" \
              -o "dist/netdisk-${os}_${name_arch}${ext}" .
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
